<!doctype html>
<html lang="fr">
	<head>
		<title>Réglages de la poussée</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>

	<body>
		<sdpi-item label="Poussée">
			<sdpi-select setting="percent" default="0" placeholder="Choisir">
				<option value="0">0 %</option>
				<option value="25">25 %</option>
				<option value="50">50 %</option>
				<option value="75">75 %</option>
				<option value="100">100 %</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item>
			<p>Un appui fixe la poussée du véhicule à cette valeur.</p>
		</sdpi-item>

		<!-- Réglage commun à toutes les touches StreamPlug (réglage global). -->
		<sdpi-item label="Port du mod">
			<sdpi-textfield setting="port" global placeholder="8765" pattern="[0-9]{4,5}"></sdpi-textfield>
		</sdpi-item>
	</body>
</html>

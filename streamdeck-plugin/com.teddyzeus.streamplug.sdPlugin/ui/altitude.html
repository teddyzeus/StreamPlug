<!doctype html>
<html lang="fr">
	<head>
		<title>Réglages de l'altitude</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>

	<body>
		<sdpi-item label="Altitude">
			<sdpi-select setting="mode" placeholder="Choisir">
				<option value="surface">Au-dessus du sol (défaut)</option>
				<option value="sea">Au-dessus du niveau de la mer</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item>
			<p>Un appui sur la touche bascule entre les deux.</p>
		</sdpi-item>

		<!-- Réglage commun à toutes les touches StreamPlug (réglage global). -->
		<sdpi-item label="Port du mod">
			<sdpi-textfield setting="port" global placeholder="8765" pattern="[0-9]{4,5}"></sdpi-textfield>
		</sdpi-item>
	</body>
</html>
